name: Pages

# v0.46.2: one artifact, two sites. The showcase replay (packages/web's demo.html — the real front
# end on a tape, see ARCHITECTURE.md "The showcase replay") is built here and becomes the site
# root; the engineering map (showcase/engineering/) is copied under /engineering/ by the same
# build script. So a change to either — or to the protocol the tape is validated against —
# redeploys both.

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/protocol/**'
      - 'showcase/engineering/**'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the showcase (replay at /, engineering map at /engineering/)
        run: bun run --cwd packages/web build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
